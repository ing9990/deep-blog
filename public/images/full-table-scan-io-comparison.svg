<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" fill="none">
  <style>
    text { font-family: 'Pretendard', sans-serif; }
    .title { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .label { font-size: 10px; fill: #475569; font-weight: 500; }
    .page-text { font-size: 9px; fill: #94a3b8; font-weight: 500; }
    .match-text { font-size: 9px; fill: #fff; font-weight: 600; }
    .stat { font-size: 12px; fill: #334155; font-weight: 600; }
    .stat-label { font-size: 10px; fill: #64748b; }
    .head-label { font-size: 10px; fill: #dc2626; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e2e8f0; }
      .subtitle { fill: #94a3b8; }
      .label { fill: #94a3b8; }
      .page-text { fill: #64748b; }
      .stat { fill: #cbd5e1; }
      .stat-label { fill: #94a3b8; }
    }
  </style>

  <!-- Sequential I/O (Full Table Scan) -->
  <g transform="translate(20, 20)">
    <text class="title" x="200" y="0" text-anchor="middle">Sequential I/O</text>
    <text class="subtitle" x="200" y="18" text-anchor="middle">Full Table Scan — 모든 페이지를 순서대로 읽는다</text>

    <!-- Disk platter representation -->
    <g transform="translate(200, 160)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="120" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Track rings -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <!-- Center spindle -->
      <circle cx="0" cy="0" r="15" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Sectors on outer track - all read sequentially -->
      <!-- 12 sectors evenly spaced on the outer track -->
      <g>
        <!-- Sector 1 - read -->
        <path d="M0,-100 A100,100 0 0,1 50,-86.6 L30,-52 A60,60 0 0,0 0,-60 Z" fill="#3b82f6" opacity="0.7"/>
        <!-- Sector 2 - read -->
        <path d="M50,-86.6 A100,100 0 0,1 86.6,-50 L52,-30 A60,60 0 0,0 30,-52 Z" fill="#3b82f6" opacity="0.6"/>
        <!-- Sector 3 - read, match -->
        <path d="M86.6,-50 A100,100 0 0,1 100,0 L60,0 A60,60 0 0,0 52,-30 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 4 - read -->
        <path d="M100,0 A100,100 0 0,1 86.6,50 L52,30 A60,60 0 0,0 60,0 Z" fill="#3b82f6" opacity="0.5"/>
        <!-- Sector 5 - read -->
        <path d="M86.6,50 A100,100 0 0,1 50,86.6 L30,52 A60,60 0 0,0 52,30 Z" fill="#3b82f6" opacity="0.6"/>
        <!-- Sector 6 - read, match -->
        <path d="M50,86.6 A100,100 0 0,1 0,100 L0,60 A60,60 0 0,0 30,52 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 7 - read -->
        <path d="M0,100 A100,100 0 0,1 -50,86.6 L-30,52 A60,60 0 0,0 0,60 Z" fill="#3b82f6" opacity="0.5"/>
        <!-- Sector 8 - read -->
        <path d="M-50,86.6 A100,100 0 0,1 -86.6,50 L-52,30 A60,60 0 0,0 -30,52 Z" fill="#3b82f6" opacity="0.6"/>
        <!-- Sector 9 - read, match -->
        <path d="M-86.6,50 A100,100 0 0,1 -100,0 L-60,0 A60,60 0 0,0 -52,30 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 10 - read -->
        <path d="M-100,0 A100,100 0 0,1 -86.6,-50 L-52,-30 A60,60 0 0,0 -60,0 Z" fill="#3b82f6" opacity="0.5"/>
        <!-- Sector 11 - read -->
        <path d="M-86.6,-50 A100,100 0 0,1 -50,-86.6 L-30,-52 A60,60 0 0,0 -52,-30 Z" fill="#3b82f6" opacity="0.6"/>
        <!-- Sector 12 - read -->
        <path d="M-50,-86.6 A100,100 0 0,1 0,-100 L0,-60 A60,60 0 0,0 -30,-52 Z" fill="#3b82f6" opacity="0.7"/>
      </g>

      <!-- Smooth sweep arrow (clockwise) -->
      <path d="M5,-108 A108,108 0 1,1 -5,-108" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

      <!-- Disk head arm -->
      <line x1="130" y1="130" x2="55" y2="-40" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <circle cx="55" cy="-40" r="4" fill="#dc2626"/>
      <text class="head-label" x="138" y="145">헤드</text>
    </g>

    <!-- Stats -->
    <text class="stat" x="200" y="310" text-anchor="middle">읽은 페이지: 12 / 12 (전부)</text>
    <text class="stat-label" x="200" y="328" text-anchor="middle">헤드 이동: 1회 연속 sweep</text>
  </g>

  <!-- Random I/O (Index Scan) -->
  <g transform="translate(460, 20)">
    <text class="title" x="200" y="0" text-anchor="middle">Random I/O</text>
    <text class="subtitle" x="200" y="18" text-anchor="middle">Index Scan — 필요한 페이지만 골라 읽는다</text>

    <!-- Disk platter representation -->
    <g transform="translate(200, 160)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="120" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Track rings -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
      <!-- Center spindle -->
      <circle cx="0" cy="0" r="15" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Sectors - only 3 are read (matches), rest are skipped -->
      <g>
        <!-- Sector 1 - skipped -->
        <path d="M0,-100 A100,100 0 0,1 50,-86.6 L30,-52 A60,60 0 0,0 0,-60 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 2 - skipped -->
        <path d="M50,-86.6 A100,100 0 0,1 86.6,-50 L52,-30 A60,60 0 0,0 30,-52 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 3 - READ (match) -->
        <path d="M86.6,-50 A100,100 0 0,1 100,0 L60,0 A60,60 0 0,0 52,-30 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 4 - skipped -->
        <path d="M100,0 A100,100 0 0,1 86.6,50 L52,30 A60,60 0 0,0 60,0 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 5 - skipped -->
        <path d="M86.6,50 A100,100 0 0,1 50,86.6 L30,52 A60,60 0 0,0 52,30 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 6 - READ (match) -->
        <path d="M50,86.6 A100,100 0 0,1 0,100 L0,60 A60,60 0 0,0 30,52 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 7 - skipped -->
        <path d="M0,100 A100,100 0 0,1 -50,86.6 L-30,52 A60,60 0 0,0 0,60 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 8 - skipped -->
        <path d="M-50,86.6 A100,100 0 0,1 -86.6,50 L-52,30 A60,60 0 0,0 -30,52 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 9 - READ (match) -->
        <path d="M-86.6,50 A100,100 0 0,1 -100,0 L-60,0 A60,60 0 0,0 -52,30 Z" fill="#22c55e" opacity="0.8"/>
        <!-- Sector 10 - skipped -->
        <path d="M-100,0 A100,100 0 0,1 -86.6,-50 L-52,-30 A60,60 0 0,0 -60,0 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 11 - skipped -->
        <path d="M-86.6,-50 A100,100 0 0,1 -50,-86.6 L-30,-52 A60,60 0 0,0 -52,-30 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
        <!-- Sector 12 - skipped -->
        <path d="M-50,-86.6 A100,100 0 0,1 0,-100 L0,-60 A60,60 0 0,0 -30,-52 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
      </g>

      <!-- Jump arrows between the 3 read sectors -->
      <!-- Sector 3 (right-top) to Sector 6 (bottom) -->
      <path d="M75,-20 Q 100,40 25,75" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>
      <!-- Sector 6 (bottom) to Sector 9 (left) -->
      <path d="M15,78 Q -40,90 -68,18" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>

      <!-- Disk head arm - showing it jumping -->
      <line x1="130" y1="130" x2="55" y2="-40" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <line x1="130" y1="130" x2="20" y2="70" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <line x1="130" y1="130" x2="-60" y2="10" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-60" cy="10" r="4" fill="#dc2626"/>
      <text class="head-label" x="138" y="145">헤드</text>

      <!-- Ghost positions of head -->
      <circle cx="55" cy="-40" r="3" fill="#dc2626" opacity="0.3"/>
      <circle cx="20" cy="70" r="3" fill="#dc2626" opacity="0.3"/>
    </g>

    <!-- Stats -->
    <text class="stat" x="200" y="310" text-anchor="middle">읽은 페이지: 3 / 12 (필요한 것만)</text>
    <text class="stat-label" x="200" y="328" text-anchor="middle">헤드 이동: 3회 seek (점프)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(240, 420)">
    <rect x="0" y="0" width="400" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="label" x="200" y="18" text-anchor="middle" style="font-weight:700">트레이드오프</text>

    <!-- Sequential -->
    <rect x="20" y="30" width="12" height="12" rx="2" fill="#3b82f6" opacity="0.6"/>
    <text class="label" x="38" y="41">읽었지만 버린 페이지</text>

    <!-- Match -->
    <rect x="200" y="30" width="12" height="12" rx="2" fill="#22c55e" opacity="0.8"/>
    <text class="label" x="218" y="41">조건에 매칭된 페이지</text>

    <!-- Skipped -->
    <rect x="20" y="52" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
    <text class="label" x="38" y="63">읽지 않고 건너뛴 페이지</text>

    <!-- Arrow -->
    <line x1="200" y1="58" x2="220" y2="58" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="226" y="63">헤드 점프 (seek)</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
