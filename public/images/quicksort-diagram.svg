<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Quick Sort 피벗 분할 개념도">
  <style>
    .cell { fill: #F4F4F5; stroke: #D4D4D8; stroke-width: 2; }
    .pivot { fill: #FEF3C7; stroke: #F59E0B; }
    .less { fill: #DBEAFE; stroke: #3B82F6; }
    .greater { fill: #FEE2E2; stroke: #EF4444; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #09090B; text-anchor: middle; }
    .caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #71717A; text-anchor: middle; }
  </style>
  <rect x="20" y="60" width="50" height="50" class="cell less" rx="6" />
  <text x="45" y="92" class="label">3</text>
  <rect x="80" y="60" width="50" height="50" class="cell less" rx="6" />
  <text x="105" y="92" class="label">9</text>
  <rect x="140" y="60" width="50" height="50" class="cell less" rx="6" />
  <text x="165" y="92" class="label">10</text>
  <rect x="210" y="60" width="50" height="50" class="cell pivot" rx="6" />
  <text x="235" y="92" class="label">27</text>
  <rect x="280" y="60" width="50" height="50" class="cell greater" rx="6" />
  <text x="305" y="92" class="label">38</text>
  <rect x="340" y="60" width="50" height="50" class="cell greater" rx="6" />
  <text x="365" y="92" class="label">43</text>
  <rect x="400" y="60" width="50" height="50" class="cell greater" rx="6" />
  <text x="425" y="92" class="label">82</text>

  <text x="100" y="140" class="caption">피벗보다 작은 값</text>
  <text x="235" y="140" class="caption">피벗 (27)</text>
  <text x="390" y="140" class="caption">피벗보다 큰 값</text>

  <text x="300" y="30" class="label">피벗 기준 분할</text>
</svg>
