<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-label="세컨더리 인덱스에서 클러스터드 인덱스로의 이중 탐색 과정을 보여주는 다이어그램">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #18181B; text-anchor: middle; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #71717A; text-anchor: middle; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #18181B; }
    .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #3F3F46; }
    .pk-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #2563EB; }
    .arrow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; fill: #2563EB; text-anchor: middle; }
    .caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #71717A; text-anchor: middle; }
    .row { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1.5; }
    .row-highlight { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 2; }
    .section-box { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1.5; rx: 10; }
    .section-header { fill: #F4F4F5; stroke: none; }
    .arrow-line { stroke: #3B82F6; stroke-width: 2.5; stroke-dasharray: 8 4; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Section 1: Secondary Index -->
  <rect x="20" y="16" width="440" height="270" class="section-box" />
  <rect x="20" y="16" width="440" height="44" rx="10" class="section-header" />
  <rect x="20" y="40" width="440" height="20" class="section-header" />
  <text x="240" y="44" class="title">세컨더리 인덱스 리프 노드</text>
  <text x="240" y="72" class="subtitle">(from_address, block_id DESC)</text>

  <!-- Column headers -->
  <text x="40" y="108" class="label">from_address</text>
  <text x="220" y="108" class="label">block_id</text>
  <text x="360" y="108" class="pk-label">PK</text>

  <!-- Row 1 -->
  <rect x="32" y="118" width="416" height="38" rx="6" class="row" />
  <text x="40" y="142" class="value">0xA1f3...</text>
  <text x="220" y="142" class="value">1042</text>
  <text x="360" y="142" class="pk-label">7821</text>

  <!-- Row 2 (highlighted) -->
  <rect x="32" y="164" width="416" height="38" rx="6" class="row-highlight" />
  <text x="40" y="188" class="value" font-weight="600">0xA1f3...</text>
  <text x="220" y="188" class="value" font-weight="600">1039</text>
  <text x="360" y="188" class="pk-label" font-weight="700">3456</text>

  <!-- Row 3 -->
  <rect x="32" y="210" width="416" height="38" rx="6" class="row" />
  <text x="40" y="234" class="value">0xA1f3...</text>
  <text x="220" y="234" class="value">1035</text>
  <text x="360" y="234" class="pk-label">9012</text>

  <text x="240" y="268" class="caption">리프에는 인덱스 키 + PK만 저장 (행 데이터 없음)</text>

  <!-- Arrow section -->
  <line x1="240" y1="294" x2="240" y2="390" class="arrow-line" />
  <rect x="130" y="320" width="220" height="36" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="240" y="344" class="arrow-label">PK = 3456 으로 재탐색</text>
  <text x="240" y="378" class="caption">$O(\log n)$ — 3~4회 페이지 접근</text>

  <!-- Section 2: Clustered Index -->
  <rect x="20" y="400" width="440" height="280" class="section-box" />
  <rect x="20" y="400" width="440" height="44" rx="10" class="section-header" />
  <rect x="20" y="424" width="440" height="20" class="section-header" />
  <text x="240" y="428" class="title">클러스터드 인덱스 리프 노드</text>
  <text x="240" y="456" class="subtitle">PK 기반 B+Tree — 실제 행 데이터 저장</text>

  <!-- Column headers -->
  <text x="40" y="492" class="pk-label">PK</text>
  <text x="100" y="492" class="label">from</text>
  <text x="190" y="492" class="label">to</text>
  <text x="280" y="492" class="label">block</text>
  <text x="370" y="492" class="label">value</text>

  <!-- Row 1 -->
  <rect x="32" y="502" width="416" height="38" rx="6" class="row" />
  <text x="40" y="526" class="value">3455</text>
  <text x="100" y="526" class="value">0xB2...</text>
  <text x="190" y="526" class="value">0xC4...</text>
  <text x="280" y="526" class="value">1038</text>
  <text x="370" y="526" class="value">0.3 ETH</text>

  <!-- Row 2 (highlighted - the one we looked up) -->
  <rect x="32" y="548" width="416" height="38" rx="6" class="row-highlight" />
  <text x="40" y="572" class="pk-label" font-weight="700">3456</text>
  <text x="100" y="572" class="value" font-weight="600">0xA1...</text>
  <text x="190" y="572" class="value" font-weight="600">0xD7...</text>
  <text x="280" y="572" class="value" font-weight="600">1039</text>
  <text x="370" y="572" class="value" font-weight="600">0.5 ETH</text>

  <!-- Row 3 -->
  <rect x="32" y="594" width="416" height="38" rx="6" class="row" />
  <text x="40" y="618" class="value">3457</text>
  <text x="100" y="618" class="value">0xE9...</text>
  <text x="190" y="618" class="value">0xF1...</text>
  <text x="280" y="618" class="value">1040</text>
  <text x="370" y="618" class="value">0.1 ETH</text>

  <text x="240" y="656" class="caption">리프에 실제 행 데이터 전체가 저장됨</text>
</svg>
