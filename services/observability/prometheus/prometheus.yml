# Prometheus scrape config for mini-Coupang local dev.
# - host.docker.internal: Prometheus runs in a container, services run on
#   the host. This name resolves to the host gateway on Docker Desktop.
# - Spring Actuator에서 management.endpoints.web.exposure.include에
#   prometheus를 넣어야 /actuator/prometheus가 노출된다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mini-coupang'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
