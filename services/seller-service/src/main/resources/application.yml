spring:
  application:
    name: seller-service
  # Java 21 virtual threads for request handling. Lets MVC (blocking API)
  # scale like reactive code for I/O-bound workloads without adopting
  # WebFlux.
  threads:
    virtual:
      enabled: true

  # Local dev datasource. Expects services/docker-compose.yml Postgres
  # to be running (docker compose up -d postgres). Integration tests
  # ignore this and use Testcontainers via @ServiceConnection.
  datasource:
    url: jdbc:postgresql://localhost:5432/seller_db
    username: deep
    password: deep_local

  jpa:
    hibernate:
      # Phase 1a: Hibernate가 스키마 관리. Phase 2에서 Flyway로 이관.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    # Lazy 로딩 에러를 런타임이 아닌 개발 중에 드러내기 위해 off.
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Phase 2: Prometheus scraping 가능하도록 /actuator/prometheus
        # 노출. Micrometer가 JVM + HTTP 서버 메트릭을 기본 export.
        include: [health, info, prometheus, metrics]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # 각 서비스의 모든 메트릭에 application 태그를 달아 Grafana/Prometheus
      # 쿼리에서 필터/그룹화 쉬움.
      application: seller-service

logging:
  level:
    # Show actual SQL from JPA during dev; trim later when noise dominates.
    org.hibernate.SQL: DEBUG
