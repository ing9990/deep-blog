# Shared development infrastructure for all backend services.
#
# Phase 1 MVP: only Postgres. Redis / Prometheus / Grafana / OTel Collector /
# Tempo will be added in later steps when we introduce the concept that needs
# them. The volume mount under ./.volumes/postgres persists data across
# container restarts; delete it to wipe state.
#
# Usage:
#   cd services
#   docker compose up -d postgres
#   docker compose ps
#   docker compose exec postgres psql -U deep -c '\l'   # list databases
#
# Stop:
#   docker compose down          # keep data
#   docker compose down -v       # stop + remove anonymous volumes
#   rm -rf .volumes/postgres     # wipe persistent data

services:
  postgres:
    image: postgres:16
    container_name: deep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deep
      POSTGRES_PASSWORD: deep_local
      # "deep" is the bootstrap database that always exists. The real
      # per-service databases (seller_db, product_db) are created by the
      # init script in ./init/ on first container start.
      POSTGRES_DB: deep
    ports:
      - "5432:5432"
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep -d deep"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prometheus scrapes /actuator/prometheus from each JVM service (seller,
  # product, ...) every 15s. Services run on the host, so scrape targets
  # use host.docker.internal (macOS Docker Desktop; Linux needs an
  # extra_hosts or the container has to share the host network).
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: deep-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.volumes/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  # Grafana UI on http://localhost:3000 with anonymous viewer access so
  # you don't need to log in for local dev. Admin password kept simple
  # for the off-chance you need it. Prometheus is pre-provisioned as the
  # default datasource, so dashboards just work.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: deep-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: deep_local
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.volumes/grafana:/var/lib/grafana
    depends_on:
      - prometheus
