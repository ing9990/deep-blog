spring:
  application:
    name: mini-coupang
  threads:
    virtual:
      enabled: true

  # 단일 monolith → 단일 DB. MSA 분리 시 도메인별 스키마/DB로 분할 예정.
  datasource:
    url: jdbc:postgresql://localhost:5432/minicoupang_db
    username: deep
    password: deep_local

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: [health, info, prometheus, metrics]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mini-coupang

logging:
  level:
    org.hibernate.SQL: DEBUG

# JWT secret은 로컬용 기본값. 운영에서는 ${APP_JWT_SECRET} 환경변수로 주입.
# HS256은 최소 32바이트 필요.
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-please-change-in-production-0123456789}
    ttl: 1h
