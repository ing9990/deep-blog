// 모든 서비스가 의존하는 공통 모듈. Spring Boot 실행 모듈 아님 (라이브러리).
// 여기에는 도메인 엔티티가 들어오지 않는다. 공용 예외/응답/이벤트/Feign 설정만.

plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.9"
    }
}

dependencies {
    api 'org.springframework:spring-web'
    api 'jakarta.validation:jakarta.validation-api'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'com.fasterxml.jackson.core:jackson-databind'

    // Kafka producer (consumer 측은 spring-kafka 본체가 필요해서 각 서비스에서 추가)
    api 'org.springframework.kafka:spring-kafka'

    // SLF4J facade (KafkaProducer @Slf4j)
    api 'org.slf4j:slf4j-api'

    // BaseEntity 의 @MappedSuperclass + JPA Auditing 어노테이션
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-jpa'

    // TSID (BaseEvent 의 eventId 생성)
    api 'com.github.f4b6a3:tsid-creator:5.2.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
