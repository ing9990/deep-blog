plugins {
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.9"
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation 'io.lettuce:lettuce-core'
    testRuntimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'com.zaxxer:HikariCP'

    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'

    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    enabled = false
}

tasks.register('it', Test) {
    description = 'MSA integration tests (compose-backed)'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    testLogging {
        events 'started', 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        showExceptions = true
        exceptionFormat = 'full'
    }
    dependsOn ':member-server:bootJar'
    dependsOn ':product-server:bootJar'
    dependsOn ':order-server:bootJar'
    dependsOn ':payment-server:bootJar'
    dependsOn ':notification-server:bootJar'
}
