# integration-test 모듈에서 사용하는 풀 스택. 모든 인프라 + 서비스 5종 컨테이너 + 모니터링 UI.
# 호스트 포트는 1xxxx 대역으로 노출해 로컬 dev 인프라(3306/6379/9092)와 충돌하지 않게 분리.
# 통합 테스트 코드와 k6 는 호스트 매핑 포트(`localhost:18084` 등)로 접근한다.
#
# 기동:  docker compose -f docker-compose-integration-tests.yml up -d --build
# 상태:  docker compose -f docker-compose-integration-tests.yml ps
# 종료:  docker compose -f docker-compose-integration-tests.yml down -v
#
# 테스트 실행:
#   cd ..  &&  ./gradlew :integration-test:test

services:
  mysql:
    image: mysql:8.4
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_coupang
      MYSQL_USER: mini
      MYSQL_PASSWORD: mini
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - ../shared/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "15540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: mini-coupang-integration
    depends_on:
      redis:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      CLUSTER_ID: "mini-coupang-test"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "18099:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mini-coupang-integration
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  member-server:
    build:
      context: ../member-server
    ports:
      - "18081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/member?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  product-server:
    build:
      context: ../product-server
    ports:
      - "18082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENTS_MEMBER_SERVER_URL: http://member-server:8081
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      member-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  payment-server:
    build:
      context: ../payment-server
    ports:
      - "18083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_PG_MIN_LATENCY_MS: "0"
      PAYMENT_PG_MAX_LATENCY_MS: "10"
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  order-server:
    build:
      context: ../order-server
    ports:
      - "18084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orders?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENTS_MEMBER_SERVER_URL: http://member-server:8081
      CLIENTS_PRODUCT_SERVER_URL: http://product-server:8082
      CLIENTS_PAYMENT_SERVER_URL: http://payment-server:8083
    depends_on:
      member-server: { condition: service_healthy }
      product-server: { condition: service_healthy }
      payment-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  notification-server:
    build:
      context: ../notification-server
    ports:
      - "18085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
