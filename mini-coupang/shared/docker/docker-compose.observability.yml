# 학습용 관찰 도구. 같은 compose project 로 띄워서 docker-compose.test.yml 의 kafka/redis 와
# 동일 default network 를 공유한다 (hostname `kafka`, `redis` 로 접근).
#
# 기동:
#   docker compose \
#     -f docker-compose.test.yml \
#     -f docker-compose.test.override.yml \
#     -f docker-compose.observability.yml up -d
#
# 접속:
#   - Kafka UI       : http://localhost:18099
#   - RedisInsight   : http://localhost:15540  (자동으로 redis:6379 가 등록됨)

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: mini-coupang
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "18099:8080"
    depends_on:
      kafka:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: mini-coupang
    ports:
      - "15540:5540"
    depends_on:
      redis:
        condition: service_healthy
