services:
  mysql:
    image: mysql:8.4
    container_name: mini-coupang-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_coupang
      MYSQL_USER: mini
      MYSQL_PASSWORD: mini
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mini-coupang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NOTE: ml, qdrant 서비스는 Desktop PC(Windows, GPU)로 이관됨.
  #  - ml: Windows 네이티브 Python venv(PyTorch CUDA)로 직접 실행
  #  - qdrant: PC Docker 단일 컨테이너로 실행 (127.0.0.1:6333-6334)
  # Spring Boot gRPC 타겟은 application.yaml 에서 192.168.50.8:50051 로 지정.
  # 볼륨 정의(qdrant-data, hf-cache)는 과거 데이터 보존 목적으로 남겨두고, 필요 없어지면 `docker volume rm` 으로 정리.

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mini-coupang-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mini-coupang-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

  ml:
    build:
      context: ../..             # mini-coupang/
      dockerfile: ml/Dockerfile
    container_name: mini-coupang-ml
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      EMBED_PORT: "50051"
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      QDRANT_COLLECTION: products
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      # bge-m3 모델(약 2.3GB) 재다운로드 방지. 호스트 HF 캐시가 있으면 그대로 재사용.
      - hf-cache:/root/.cache/huggingface

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mini-coupang-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mini-coupang-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  hf-cache:
