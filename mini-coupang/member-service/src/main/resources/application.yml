spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://localhost:5442/member
    username: member
    password: member
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6390}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:dev-secret-do-not-use-in-prod-min-32-chars-please-replace-me-now}
  access-ttl: PT30M
  refresh-ttl: P14D
