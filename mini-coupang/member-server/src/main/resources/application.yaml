spring:
  application:
    name: member-server

  datasource:
    url: jdbc:mysql://localhost:3306/member?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: mini
    password: mini
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: redis
    redis:
      namespace: spring:session
    timeout: 30m

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

server:
  port: 8081
  servlet:
    session:
      cookie:
        name: SESSION
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.deepblog: INFO
    org.springframework.kafka: INFO
