services:
  postgres-member:
    image: postgres:16
    container_name: mc-postgres-member
    environment:
      POSTGRES_DB: member
      POSTGRES_USER: member
      POSTGRES_PASSWORD: member
    ports:
      - "5442:5432"
    volumes:
      - postgres-member-data:/var/lib/postgresql/data

  postgres-seller:
    image: postgres:16
    container_name: mc-postgres-seller
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: seller
      POSTGRES_USER: seller
      POSTGRES_PASSWORD: seller
    ports:
      - "5443:5432"
    volumes:
      - postgres-seller-data:/var/lib/postgresql/data

  postgres-product:
    image: postgres:16
    container_name: mc-postgres-product
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
    ports:
      - "5444:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mc-redis
    ports:
      - "6390:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: mc-kafka-connect
    depends_on:
      - kafka
      - postgres-seller
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: mc-debezium
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: mc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    ports:
      - "9190:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:2.5.0
    container_name: mc-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mc-grafana
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3100:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  k6:
    image: grafana/k6:0.53.0
    container_name: mc-k6
    profiles: [ "loadtest" ]
    volumes:
      - ./loadtest/scripts:/scripts:ro
      - ./loadtest/results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K6_OUT: json=/results/${K6_RUN_ID:-last}.json
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8083}

volumes:
  postgres-member-data:
  postgres-seller-data:
  postgres-product-data:
  tempo-data:
  grafana-data:
