spring:
  application:
    name: mini-coupang
  datasource:
    url: jdbc:mysql://localhost:3306/mini_coupang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: mini
    password: mini
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        embed.index.latency: true
      percentiles:
        embed.index.latency: 0.5, 0.9, 0.95, 0.99

grpc:
  client:
    embed:
      address: 'static://localhost:50051'
      negotiation-type: plaintext

embed:
  grpc:
    deadline-ms: 5000
