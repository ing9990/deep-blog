spring:
  application:
    name: payment-server

  datasource:
    url: jdbc:mysql://localhost:3306/payment?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: mini
    password: mini
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8083

# 결제에 인위적으로 추가하는 지연 (ms). 분산 환경 시뮬레이션 + Saga 보상 시나리오 측정용.
payment:
  simulated-latency-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.deepblog: INFO
    org.springframework.kafka: INFO
